<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks Notes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Daily Tasks Notes</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..." 
                    class="task-input"
                >
                <select id="categorySelect" class="category-select">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Health">Health</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>
                <select id="prioritySelect" class="priority-select">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <input 
                type="date" 
                id="dueDateInput" 
                class="due-date-input"
            >
            <button id="addBtn" class="add-btn">➕ Add Task</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="Personal">Personal</button>
            <button class="filter-btn" data-filter="Work">Work</button>
            <button class="filter-btn" data-filter="Health">Health</button>
        </div>

        <div class="tasks-section">
            <ul id="taskList" class="task-list"></ul>
            <div id="emptyState" class="empty-state">
                <p>✨ No tasks yet. Add one to get started!</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-label">Total</span>
                <span id="totalCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed</span>
                <span id="completedCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Pending</span>
                <span id="pendingCount" class="stat-value">0</span>
            </div>
        </div>

        <div class="actions">
            <button id="clearCompletedBtn" class="action-btn clear-btn">🗑️ Clear Completed</button>
            <button id="exportBtn" class="action-btn export-btn">📥 Export as JSON</button>
            <button id="importBtn" class="action-btn import-btn">📤 Import JSON</button>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
